kbap_api:
  base_url: https://dev.kbap.site/api # 홈서버 배포 시 실제 kbap 주소로 교체. 인증: KBAP_API_TOKEN 환경변수
llm:
  # "provider:model" 이면 그 벤더를, 접두사 없이 gemini* 면 google_genai 를 쓴다.
  # 교체 예시: gemini-2.5-flash / openai:gpt-5-nano / openai:gpt-5-mini
  model: openai:gpt-5-mini # 기본 채점 모델
  avoidance_model: openai:gpt-5-mini # 안전 직결 노드 — kbap KB-236 에서 nano 가 후보 밖 코드를 흘린 전례가 있어 mini 유지
  timeout_seconds: 120 # LLM 콜 타임아웃. 모델이 느려지면 이 값을 조정
thresholds: # 필드군별 통과 임계값 — 운영하며 튜닝
  description: 70
  translations: 60
  avoidance: 70
concurrency: 5
