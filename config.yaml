kbap_api:
  # 호스트까지만 입력한다. /api/admin/... 경로는 클라이언트가 붙인다.
  # 이 값은 기본값(dev)이며 Lambda 환경변수 KBAP_API_BASE_URL 이 있으면 그쪽이 이긴다 —
  # 이미지에 구워지는 파일이라 prod 함수는 환경변수로 주소를 가른다(KB-549).
  base_url: https://dev.kbap.site # 인증: KBAP_API_TOKEN 환경변수
llm:
  # "provider:model" 형식이면 해당 제공자를, 접두사 없는 gemini*는 google_genai를 사용한다.
  # 교체 예시: gemini-2.5-flash / openai:gpt-5-nano / openai:gpt-5-mini
  # 2026-10-14 gpt-6-luna 로 전 노드 전환 — 5.6-luna 대비 입력 $0.20→$0.10, 출력 $1.20→$0.50.
  # 8월 nano 실험에서 이름 정제만 품질 미달이었으니, 재발 시 namefix_model 부터 되돌린다.
  model: openai:gpt-6-luna # 검수 3종·기피성분 생성·(gen_model 미설정 시) 번역·설명 생성
  avoidance_model: openai:gpt-6-luna # 과도기 review 배치 전용 — 콘텐츠 그래프의 기피성분 노드는 model을 따른다. 과거 소형 모델이 후보 밖 코드를 반환한 사례가 있어 valid_substances 필터·검수가 방어선이다
  namefix_model: openai:gpt-6-luna # 이름 정제 — 모델 민감도가 가장 높은 노드(nano 는 오타 교정 실패)
  # gen_model: openai:gpt-5 # 번역·설명 생성만 상위 모델로 — 비용이 크게 늘므로 품질 미달이 데이터로 확인될 때만
  timeout_seconds: 120 # LLM 호출 타임아웃. 모델이 느려지면 이 값을 조정
# 검수 3곳(이름·설명·기피성분) 엔진 — llm(기존) | jev(TypeSafe, KB-913). 환경변수 REVIEW_ENGINE 이 이긴다.
# jev 는 TYPESAFE_API_KEY 필요. 생성은 엔진과 무관하게 위 llm 설정을 쓴다.
review_engine: llm
jev:
  model: jev-1.14.0 # 버전 고정 — 별칭(jev-latest)은 바뀌면 A/B 재현이 깨진다
  timeout_seconds: 10
  max_attempts: 2 # timeout·429·5xx 공통(최초 포함). 그래프·SQS 재시도와 곱해지지 않게 여기 한 곳만
  # policy: 확률 임계값 — 생략 시 kbap.jev.JevPolicy 기본값(보정 전). 조정용 데이터로 정해 여기 고정한다
thresholds: # 필드군별 통과 임계값 — 운영 중 조정
  description: 70
  avoidance: 70
concurrency: 5
