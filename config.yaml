kbap_api:
  # 호스트까지만 입력한다. /api/v1/admin/... 경로는 클라이언트가 붙인다.
  base_url: https://dev.kbap.site # 인증: KBAP_API_TOKEN 환경변수
llm:
  # "provider:model" 형식이면 해당 제공자를, 접두사 없는 gemini*는 google_genai를 사용한다.
  # 교체 예시: gemini-2.5-flash / openai:gpt-5-nano / openai:gpt-5-mini
  model: openai:gpt-5.6-luna # 전 노드 nano 실험 — 품질 미달인 노드가 확인되면 그 노드만 다시 올린다
  avoidance_model: openai:gpt-5.6-luna # 과도기 review 배치 전용 — 콘텐츠 그래프의 기피성분 노드는 model을 따른다. 과거 소형 모델이 후보 밖 코드를 반환한 사례가 있어 valid_substances 필터·검수가 방어선이다
  judge_model: openai:gpt-5.6-luna # 종합판정 — 점수 요약 읽고 통과/탈락만 정하므로 나노로 충분
  namefix_model: openai:gpt-5.6-luna # 이름 정제 — nano는 품질 미달, 5.6-luna가 mini보다 최신·저렴($0.20/$1.20 vs $0.25/$2.00)
  # gen_model: openai:gpt-5 # 번역·설명 생성만 상위 모델로 — 비용이 크게 늘므로 품질 미달이 데이터로 확인될 때만
  timeout_seconds: 120 # LLM 호출 타임아웃. 모델이 느려지면 이 값을 조정
thresholds: # 필드군별 통과 임계값 — 운영 중 조정
  description: 70
  avoidance: 70
concurrency: 5
