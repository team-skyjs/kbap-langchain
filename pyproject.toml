[project]
name = "kbap-review"
version = "0.1.0"
description = "음식 콘텐츠 생성·검수 LangGraph 파이프라인 — kbap(Spring) 콘텐츠 배치를 대체한다"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-google-genai>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "langfuse>=3.0",
    "python-dotenv>=1.2.2",
    "langchain-openai>=1.4.1",
]

[project.scripts]
kbap = "kbap.main:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbap"]
